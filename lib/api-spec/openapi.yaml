openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jumpstart
    description: AI-generated Kanban boards
  - name: livelab
    description: Interactive code explanations
  - name: asset-reviver
    description: Convert uploaded documents into marketing content and e-books
  - name: career
    description: Career Catalyst — resume parsing and autonomous job-application tracking
paths:
  /jumpstart/boards:
    get:
      operationId: listBoards
      tags: [jumpstart]
      summary: List generated boards
      responses:
        "200":
          description: List of boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
    post:
      operationId: createBoard
      tags: [jumpstart]
      summary: Generate a Kanban board from a prompt using Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardInput"
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gemini generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jumpstart/boards/{id}:
    get:
      operationId: getBoard
      tags: [jumpstart]
      summary: Get a board by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBoard
      tags: [jumpstart]
      summary: Delete a board
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jumpstart/boards/{id}/tasks/{taskId}/delegate:
    post:
      operationId: delegateTask
      tags: [jumpstart]
      summary: Delegate a Kanban task to the background AI agent for research/a starting solution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Board with the task updated and moved to "Review & Testing"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          description: Board or task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gemini generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /livelab/explain:
    post:
      operationId: explainCode
      tags: [livelab]
      summary: Get an interactive Gemini explanation of a code snippet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainCodeInput"
      responses:
        "200":
          description: Explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Explanation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gemini generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/jobs:
    get:
      operationId: listAssetJobs
      tags: [asset-reviver]
      summary: List asset reviver jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetJob"
    post:
      operationId: createAssetJob
      tags: [asset-reviver]
      summary: Upload a file (Excel or Notion export) and start background processing into marketing content and an e-book
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AssetJobUpload"
      responses:
        "202":
          description: Job accepted and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetJob"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/jobs/{id}:
    get:
      operationId: getAssetJob
      tags: [asset-reviver]
      summary: Get an asset reviver job's status and results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /career/resumes:
    get:
      operationId: listResumes
      tags: [career]
      summary: List uploaded resumes
      responses:
        "200":
          description: List of resumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resume"
    post:
      operationId: uploadResume
      tags: [career]
      summary: Upload a resume (PDF/Word) and parse it with Gemini; optionally merge active JumpStart project context
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ResumeUpload"
      responses:
        "201":
          description: Resume created and parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /career/resumes/{id}:
    get:
      operationId: getResume
      tags: [career]
      summary: Get a parsed resume by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /career/applications:
    get:
      operationId: listApplications
      tags: [career]
      summary: List job applications
      responses:
        "200":
          description: List of job applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplication"
    post:
      operationId: createApplication
      tags: [career]
      summary: Create a job application and generate a tailored cover letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationBody"
      responses:
        "201":
          description: Application created with generated cover letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gemini generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /career/applications/{id}:
    patch:
      operationId: updateApplication
      tags: [career]
      summary: Update application status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationBody"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteApplication
      tags: [career]
      summary: Delete an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    BoardTask:
      type: object
      required: [id, title, description]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        agentNotes:
          type: string
          description: Research/starting solution produced by delegating this task to the background AI agent.
    BoardColumn:
      type: object
      required: [id, title, tasks]
      properties:
        id:
          type: string
        title:
          type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/BoardTask"
    Board:
      type: object
      required: [id, prompt, title, columns, createdAt]
      properties:
        id:
          type: integer
        prompt:
          type: string
        title:
          type: string
        language:
          type: string
          description: Language the board's task titles/descriptions were written in.
        columns:
          type: array
          items:
            $ref: "#/components/schemas/BoardColumn"
        createdAt:
          type: string
          format: date-time
    BoardInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        language:
          type: string
          description: BCP-47-ish language code (en, ar, fr, es, de) the generated task titles/descriptions should be written in. Defaults to English.
    ExplainCodeInput:
      type: object
      required: [code, programmingLanguage]
      properties:
        code:
          type: string
          minLength: 1
        programmingLanguage:
          type: string
          description: Programming language of the code snippet (javascript, python, etc.)
        question:
          type: string
          description: Optional follow-up question about the code; if omitted, a general explanation is generated.
        uiLanguage:
          type: string
          description: BCP-47-ish language code (en, ar, fr, es, de) the explanation should be written in. Defaults to English.
    Explanation:
      type: object
      required: [explanation]
      properties:
        explanation:
          type: string
    AssetJobUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
        text:
          type: string
          description: >-
            Raw draft content/data pasted directly by the user, used instead
            of a file upload. Exactly one of `file` or `text` must be
            provided and non-empty; if both are provided, `file` takes
            precedence and `text` is ignored. Omitting both returns a 400.
        language:
          type: string
          description: BCP-47-ish language code (en, ar, fr, es, de) the generated marketing copy/e-book/cover should be written in. Defaults to English.
    ResumeUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PDF or Word document resume.
        country:
          type: string
          description: Target country for job search (e.g. "United States").
        remote:
          type: boolean
          description: Whether the candidate is open to remote work.
    Resume:
      type: object
      required: [id, filename, parsedSummary, createdAt]
      properties:
        id:
          type: integer
        filename:
          type: string
        country:
          type: string
          nullable: true
        remote:
          type: boolean
          nullable: true
        parsedSummary:
          type: string
          description: Gemini-extracted structured summary of the resume merged with active JumpStart project context.
        skills:
          type: string
          nullable: true
        experience:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    JobApplicationStatus:
      type: string
      enum: [found, applying, submitted]
    JobApplication:
      type: object
      required: [id, resumeId, company, role, status, createdAt]
      properties:
        id:
          type: integer
        resumeId:
          type: integer
        company:
          type: string
        role:
          type: string
        status:
          $ref: "#/components/schemas/JobApplicationStatus"
        coverLetter:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateApplicationBody:
      type: object
      required: [resumeId, company, role]
      properties:
        resumeId:
          type: integer
        company:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        jobDescription:
          type: string
          description: Optional job description to tailor the cover letter.
        notes:
          type: string
    UpdateApplicationBody:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/JobApplicationStatus"
        notes:
          type: string
    AssetJobStatus:
      type: string
      enum: [pending, processing, completed, failed]
    AssetJob:
      type: object
      required: [id, filename, status, createdAt]
      properties:
        id:
          type: integer
        filename:
          type: string
        status:
          $ref: "#/components/schemas/AssetJobStatus"
        marketingContent:
          type: ["string", "null"]
        ebookContent:
          type: ["string", "null"]
        coverSvg:
          type: ["string", "null"]
          description: A sanitized, self-contained SVG sketch of a promotional cover/thumbnail for the asset.
        language:
          type: string
          description: Language the generated content was written in.
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

